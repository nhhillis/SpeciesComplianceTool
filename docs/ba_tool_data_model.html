<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BA Tool Data Model</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #1a1a1a;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  h2 {
    color: #c8c8b4;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin: 0 0 20px 0;
    opacity: 0.6;
  }
  svg {
    max-width: 720px;
    width: 100%;
  }
</style>
</head>
<body>
<h2>BA Tool — Data Model</h2>
<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- StepResult box -->
  <rect x="40" y="30" width="600" height="110" rx="8" fill="#3b2f5e" stroke="#7c66c0" stroke-width="0.5"/>
  <text font-family="'Courier New', monospace" font-size="14" font-weight="600" fill="#ccc0f0" x="340" y="60" text-anchor="middle" dominant-baseline="central">StepResult</text>
  <text font-family="'Courier New', monospace" font-size="11" fill="#a090d0" x="340" y="84" text-anchor="middle" dominant-baseline="central">fields: Dict[str, BAField] — one BAField per piece of data produced by this step</text>
  <text font-family="'Courier New', monospace" font-size="11" fill="#a090d0" x="340" y="104" text-anchor="middle" dominant-baseline="central">issues: List[str] — step-level problems (e.g. "IPaC API unreachable")</text>
  <text font-family="'Courier New', monospace" font-size="11" fill="#a090d0" x="340" y="124" text-anchor="middle" dominant-baseline="central">status: str — "success" by default</text>

  <!-- Arrow down -->
  <line x1="340" y1="140" x2="340" y2="188" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text font-family="'Courier New', monospace" font-size="11" fill="#777" x="355" y="166" dominant-baseline="central">contains many</text>

  <!-- BAField box 1 -->
  <rect x="40" y="193" width="180" height="132" rx="8" fill="#1e3d38" stroke="#3d9e8a" stroke-width="0.5"/>
  <text font-family="'Courier New', monospace" font-size="13" font-weight="600" fill="#7dd4c0" x="130" y="220" text-anchor="middle" dominant-baseline="central">BAField</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="130" y="246" text-anchor="middle" dominant-baseline="central">tag: "ipac__species"</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="130" y="266" text-anchor="middle" dominant-baseline="central">value: [gray bat, ...]</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="130" y="286" text-anchor="middle" dominant-baseline="central">source: AUTO</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="130" y="306" text-anchor="middle" dominant-baseline="central">issues: []</text>

  <!-- BAField box 2 -->
  <rect x="250" y="193" width="180" height="132" rx="8" fill="#1e3d38" stroke="#3d9e8a" stroke-width="0.5"/>
  <text font-family="'Courier New', monospace" font-size="13" font-weight="600" fill="#7dd4c0" x="340" y="220" text-anchor="middle" dominant-baseline="central">BAField</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="340" y="246" text-anchor="middle" dominant-baseline="central">tag: "ipac__wetlands"</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="340" y="266" text-anchor="middle" dominant-baseline="central">value: []</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="340" y="286" text-anchor="middle" dominant-baseline="central">source: AUTO</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="340" y="306" text-anchor="middle" dominant-baseline="central">issues: []</text>

  <!-- BAField box 3 -->
  <rect x="460" y="193" width="180" height="132" rx="8" fill="#1e3d38" stroke="#3d9e8a" stroke-width="0.5"/>
  <text font-family="'Courier New', monospace" font-size="13" font-weight="600" fill="#7dd4c0" x="550" y="220" text-anchor="middle" dominant-baseline="central">BAField</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="550" y="246" text-anchor="middle" dominant-baseline="central">tag: "ipac__crithab"</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="550" y="266" text-anchor="middle" dominant-baseline="central">value: True</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="550" y="286" text-anchor="middle" dominant-baseline="central">source: AUTO</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#5aad9a" x="550" y="306" text-anchor="middle" dominant-baseline="central">issues: []</text>

  <!-- Arrow down to FieldSource -->
  <line x1="340" y1="325" x2="340" y2="378" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text font-family="'Courier New', monospace" font-size="11" fill="#777" x="355" y="353" dominant-baseline="central">uses</text>

  <!-- FieldSource box -->
  <rect x="150" y="383" width="380" height="105" rx="8" fill="#2a2a2a" stroke="#666" stroke-width="0.5"/>
  <text font-family="'Courier New', monospace" font-size="13" font-weight="600" fill="#c8c8b4" x="340" y="408" text-anchor="middle" dominant-baseline="central">FieldSource  (enum)</text>

  <!-- Three members -->
  <rect x="168" y="424" width="100" height="48" rx="4" fill="#333" stroke="#555" stroke-width="0.5"/>
  <text font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#e0d080" x="218" y="442" text-anchor="middle" dominant-baseline="central">AUTO</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#999" x="218" y="462" text-anchor="middle" dominant-baseline="central">tool fetched it</text>

  <rect x="290" y="424" width="100" height="48" rx="4" fill="#333" stroke="#555" stroke-width="0.5"/>
  <text font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#e0d080" x="340" y="442" text-anchor="middle" dominant-baseline="central">FIELD</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#999" x="340" y="462" text-anchor="middle" dominant-baseline="central">biologist recorded</text>

  <rect x="412" y="424" width="100" height="48" rx="4" fill="#333" stroke="#555" stroke-width="0.5"/>
  <text font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#e0d080" x="462" y="442" text-anchor="middle" dominant-baseline="central">AUTHOR</text>
  <text font-family="'Courier New', monospace" font-size="10" fill="#999" x="462" y="462" text-anchor="middle" dominant-baseline="central">biologist wrote it</text>
</svg>
</body>
</html>
